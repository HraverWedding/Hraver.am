
<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ձեր Հյուրերը - Admin Dashboard</title>
    <!-- SheetJS Excel-ի համար -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f5f2eb; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; }
        
        h2 { text-align: center; margin-bottom: 15px; color: #4a4a4a; font-weight: 500; }
        
        /* Stats Cards */
        .stats { display: flex; gap: 8px; margin-bottom: 20px; }
        .card { flex: 1; background: #e8e5de; padding: 12px 8px; border-radius: 12px; text-align: center; border: 1px solid #dcd8cf; }
        .card .number { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .card .label { font-size: 11px; color: #666; }
        .card.yes .number { color: #2e7d32; }
        .card.no .number { color: #c62828; }

        /* Search & Filters */
        .search-box { width: 100%; padding: 12px 16px; border-radius: 25px; border: 1px solid #dcd8cf; background: #eae7e0; outline: none; margin-bottom: 12px; font-size: 14px; }
        
        .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 15px; }
        .btn-filter { padding: 8px 16px; border-radius: 20px; border: 1px solid #dcd8cf; background: #fff; cursor: pointer; font-size: 13px; color: #555; }
        .btn-filter.active { background: #111; color: #fff; border-color: #111; }
        
        .btn-excel { width: 100%; background: #1e5631; color: white; padding: 12px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 20px; font-size: 14px; }

        .count-info { font-size: 13px; color: #666; margin-bottom: 10px; }

        /* Guest List */
        .guest-list { display: flex; flex-direction: column; gap: 10px; position: relative; min-height: 100px; }
        .guest-card { background: #faf8f5; border: 1px solid #e3decb; border-left: 4px solid #1e5631; border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
        .guest-card.declined { border-left-color: #c62828; }
        
        .guest-info h4 { font-size: 15px; margin-bottom: 4px; color: #222; }
        .guest-info p { font-size: 12px; color: #777; margin-bottom: 2px; }
        .guest-info .date { font-size: 10px; color: #aaa; }

        .badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; }
        .badge.yes { background: #e8f5e9; color: #2e7d32; }
        .badge.no { background: #ffebee; color: #c62828; }

        /* Loader Animation */
        .loader-container { text-align: center; padding: 30px 0; color: #777; font-size: 14px; }
        .spinner {
            width: 32px; height: 32px; margin: 0 auto 10px auto;
            border: 3px solid #dcd8cf; border-top: 3px solid #1e5631;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Ձեր Հյուրերը</h2>

    <!-- Stats -->
    <div class="stats">
        <div class="card">
            <div class="number" id="stat-total-responses">-</div>
            <div class="label">Պատասխաններ</div>
        </div>
        <div class="card yes">
            <div class="number" id="stat-total-guests">-</div>
            <div class="label">✅ Գալու եմ</div>
        </div>
        <div class="card no">
            <div class="number" id="stat-declined">-</div>
            <div class="label">❌ Չեմ գալու</div>
        </div>
    </div>

    <!-- Search & Filters -->
    <input type="text" id="search-input" class="search-box" placeholder="Որոնել անունով...">
    
    <div class="filters">
        <button class="btn-filter active" onclick="filterGuests('all', this)">Բոլորը</button>
        <button class="btn-filter" onclick="filterGuests('yes', this)">Գալու եմ</button>
        <button class="btn-filter" onclick="filterGuests('no', this)">Չեմ գալու</button>
        <button class="btn-filter" onclick="filterGuests('hars', this)">Հարսի հյուրերից</button>
        <button class="btn-filter" onclick="filterGuests('pesa', this)">Փեսայի հյուրերից</button>
    </div>

    <button class="btn-excel" onclick="exportToExcel()">⬇ Ներբեռնել Excel</button>

    <div class="count-info" id="visible-count">Բեռնվում է...</div>

    <!-- List -->
    <div class="guest-list" id="guest-container">
        <div class="loader-container">
            <div class="spinner"></div>
            <div>Տվյալները բեռնվում են...</div>
        </div>
    </div>
</div>

<script>
    // Այստեղ տեղադրիր քո Google Apps Script-ի URL-ը (չակերտների մեջ)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxuZHQaWgfCaiXE3o9JxIRIBUXEmWAYvcsp9gm2_IWkcVcUjptBRDEZyF0K4O-JGAE1/exec";

    let guests = [];
    let currentFilter = 'all';
    let isFirstLoad = true;

    async function fetchGuests() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            if (Array.isArray(data)) {
                guests = data;
            } else {
                guests = [];
            }
            
            renderGuests();
            isFirstLoad = false;
        } catch (err) {
            console.error("Տվյալները բեռնելիս սխալ տեղի ունեցավ:", err);
            if (isFirstLoad) {
                document.getElementById('guest-container').innerHTML = 
                    '<div class="loader-container" style="color:#c62828;">Չհաջողվեց բեռնել տվյալները: Ստուգեք կապը:</div>';
            }
        }
    }

    function renderGuests() {
        const container = document.getElementById('guest-container');
        const search = document.getElementById('search-input').value.toLowerCase();
        container.innerHTML = '';

        let filtered = guests.filter(g => {
            let guestName = (g.name || g.Name || '').toString();
            let matchesSearch = guestName.toLowerCase().includes(search);
            let matchesFilter = true;
            
            let attendingStatus = (g.attending || '').toString().toLowerCase();
            let guestSide = (g.side || '').toString().toLowerCase();

            if (currentFilter === 'yes') matchesFilter = attendingStatus === 'yes';
            if (currentFilter === 'no') matchesFilter = attendingStatus === 'no';
            if (currentFilter === 'hars') matchesFilter = guestSide.includes('hars');
            if (currentFilter === 'pesa') matchesFilter = guestSide.includes('pesa');

            return matchesSearch && matchesFilter;
        });

        // Update Stats
        let totalResponses = guests.length;
        let totalGuests = guests.reduce((sum, g) => sum + ((g.attending || '').toString().toLowerCase() === 'yes' ? Number(g.count || 1) : 0), 0);
        let declinedCount = guests.filter(g => (g.attending || '').toString().toLowerCase() === 'no').length;

        document.getElementById('stat-total-responses').innerText = totalResponses;
        document.getElementById('stat-total-guests').innerText = totalGuests;
        document.getElementById('stat-declined').innerText = declinedCount;
        document.getElementById('visible-count').innerText = `${filtered.length} պատասխան`;

        if (filtered.length === 0) {
            container.innerHTML = '<div class="loader-container">Տվյալներ չեն գտնվել</div>';
            return;
        }

        // Render List
        filtered.forEach(g => {
            const isYes = (g.attending || '').toString().toLowerCase() === 'yes';
            const card = document.createElement('div');
            card.className = `guest-card ${isYes ? '' : 'declined'}`;
            card.innerHTML = `
                <div class="guest-info">
                    <h4>${g.name || 'Անհայտ'}</h4>
                    <p>Հյուրեր: ${g.count || 1} • ${(g.side || '').toString().toLowerCase().includes('hars') ? 'Հարսի' : 'Փեսայի'} հյուրերից</p>
                    <div class="date">${g.date || ''}</div>
                </div>
                <div class="badge ${isYes ? 'yes' : 'no'}">
                    ${isYes ? '✅ Գալու եմ' : '❌ Չեմ գալու'}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function filterGuests(filter, btn) {
        currentFilter = filter;
        document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGuests();
    }

    document.getElementById('search-input').addEventListener('input', renderGuests);

    function exportToExcel() {
        if (guests.length === 0) {
            alert("Ցուցակը դատարկ է:");
            return;
        }
        let csvContent = "data:text/csv;charset=utf-8,\uFEFFAnun,Kargavichak,Qanak,Koghm,AmSativ\n";
        
        guests.forEach(g => {
            let row = [`"${g.name || ''}"`, `"${g.attending || ''}"`, `"${g.count || ''}"`, `"${g.side || ''}"`, `"${g.date || ''}"`];
            csvContent += row.join(",") + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Hyureri_Cucak.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Առաջին բեռնում
    fetchGuests();
    
    // Ավտոմատ թարմացում 10 վայրկյանը մեկ
    setInterval(fetchGuests, 10000);
</script>

</body>
</html>
